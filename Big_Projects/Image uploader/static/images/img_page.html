<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Image Hosting</title>
    <link rel="stylesheet" href="img_style.css"/>
</head>
<body>

<header class="main-header">
    <h1>Upload Photos</h1>
    <p>Upload selfies, memes, or any fun pictures here.</p>
    <div>
        <button id="btnGoToUpload" class="hero-button">Upload</button>
    </div>
</header>

<main>
    <section id="images" class="tab-content active">
        <table class="images-table">
            <tr>
                <th>Preview</th>
                <th>URL</th>
                <th>Del</th>
            </tr>
        </table>
        <tbody id="imagesTableBody">

        </tbody>
    </section>
</main>

<script src="img_script.js"></script>
</body>
</html>

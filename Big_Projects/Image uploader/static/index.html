<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload UI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body{
          background-color: #F5F7FA;
          font-family: Arial, sans-serif;
          height: 100vh;
          display: flex;
          justify-content: center;
          align-items: center;
          text-align: center;
          flex-direction: column;
        }

        .upload-box {
          border: 2px dashed #7D8DAA;
          padding: 40px;
          border-radius: 10px;
          width: 60%;
          max-width: 600px;
          background-color: #f5f7fa;
        }

        .upload-box:hover {
          border-color: #005eff;
        }

        .upload-failed {
          color: red;
          margin-top: 10px;
        }

        .btn-upload {
           background-color: #005eff;
           color: white;
           padding: 12px 20px;
           width: 32%;
           border-radius: 5px;
           font-weight: bold;
           margin-top: 20px;
        }

        .btn-upload:hover {
          background-color: #0046cc;
        }

        .input-url{
          display: flex;
          align-items: center;
          gap: 10px:
          width: 60%;
          max-width: 600px;
          margin-top: 20px;
        }

        .input-url input {
          flex: 1;
          padding: 10px;
          border: 1px solid #7D8DAA;
          border-radius: 5px;
        }

        .btn-copy {
          background-color: #005eff;
          color: white;
          border: none;
          padding: 10px;
          border-radius: 5px;
        }

        .btn-copy:hover {
          background-color: #0046cc;
        }
    </style>
</head>
<body>
<h4 class="fw-bold">Upload Photos</h4>
<p class="text-muted">Upload selfies, memes or any fun pictures here.</p>

<div class="d-flex justify-content-center mb-3">
    <a href="#" class="text-decoration-none fw-bold text-primary me-3">Upload</a>
    <a href="#" class="text-decoration-none text-muted">Images</a>
</div>

<div class="upload-box">
    <img src="https://cdn-icons-png.flaticon.com/512/1828/1828919.png" width="50">
    <p class="upload-failed fw-bold">Upload failed</p>
    <p class="text-muted small">Only support .jpg, .png and .gif <br> Maximum file size is 5MB</p>
</div>

<button class="btn-upload">BROWSE YOUR FILE</button>

<h6 class="fw-bold mt-4">Current Upload</h6>
<div class="input-url">
    <input type="text" class="from-control" placeholder="https://">
    <button class="btn-copy">COPY</button>
</div>

</body>
</html>
